<!-- =========================================================
     INICIO BLOCO PONTE - VER NO MAPA
     ========================================================= -->

<script>
(function() {
    function normalizarPonte(valor) {
        return String(valor || "")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/\s+/g, " ")
            .trim()
            .toUpperCase();
    }

    function buscarParametroPonte(nome) {
        return new URLSearchParams(window.location.search).get(nome);
    }

    function percorrerCamadasPonte(layer, callback) {
        if (!layer) return;

        if (layer.getLayers) {
            layer.getLayers().forEach(function(subLayer) {
                percorrerCamadasPonte(subLayer, callback);
            });
            return;
        }

        callback(layer);
    }

    function localizarItemPonteNoMapa() {
        const layerAlvo = buscarParametroPonte("ponteLayer");
        const campoAlvo = buscarParametroPonte("ponteCampo");
        const valorAlvo = buscarParametroPonte("ponteValor");

        if (!layerAlvo || !campoAlvo || !valorAlvo) return;

        if (typeof map === "undefined" || typeof ol === "undefined") {
            console.warn("PONTE - mapa ainda não disponível para localizar item.");
            return;
        }

        const layerAlvoNorm = normalizarPonte(layerAlvo);
        const valorAlvoNorm = normalizarPonte(valorAlvo);

        const encontrados = [];

        map.getLayers().forEach(function(layer) {
            percorrerCamadasPonte(layer, function(subLayer) {
                const titulo = normalizarPonte(
                    subLayer.get("title") ||
                    subLayer.get("name") ||
                    ""
                );

                if (layerAlvoNorm !== "TODAS" && !titulo.includes(layerAlvoNorm)) return;

                const source = subLayer.getSource ? subLayer.getSource() : null;

                if (!source || !source.getFeatures) return;

                source.getFeatures().forEach(function(feature) {
                    const props = feature.getProperties();
                    const valorFeature = normalizarPonte(props[campoAlvo]);

                    if (valorFeature === valorAlvoNorm) {
                        encontrados.push({
                            layer: subLayer,
                            feature: feature
                        });
                    }
                });
            });
        });

        if (!encontrados.length) {
            console.warn("PONTE - item não encontrado no mapa:", {
                layer: layerAlvo,
                campo: campoAlvo,
                valor: valorAlvo
            });
            return;
        }

        const extent = ol.extent.createEmpty();

        encontrados.forEach(function(item) {
            if (item.layer && item.layer.setVisible) {
                item.layer.setVisible(true);
            }

            const geom = item.feature.getGeometry();

            if (geom) {
                ol.extent.extend(extent, geom.getExtent());
            }
        });

        if (!ol.extent.isEmpty(extent)) {
            map.getView().fit(extent, {
                padding: [90, 90, 90, 90],
                maxZoom: 20,
                duration: 900
            });
        }

        console.log("PONTE - item localizado no mapa:", encontrados.length);
    }

    setTimeout(localizarItemPonteNoMapa, 1400);
})();
</script>
